<title>Mr Andy's Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F3EE;
  --navy: #1A2E4A;
  --yellow: #F5C800;
  --teal: #0D9488;
  --text: #1A2E4A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A2B; --text: #EEE8DF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg: #0D1A2B; --text: #EEE8DF; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px 100px;
  gap: 28px;
}
h1 {
  font-size: 2rem;
  font-weight: 900;
  text-align: center;
  line-height: 1.1;
}
h1 span { color: var(--yellow); }
.games {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 320px;
}
.game-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  border-radius: 18px;
  text-decoration: none;
  font-family: inherit;
  font-weight: 800;
  font-size: 1.15rem;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.game-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
.game-btn-lemon { background: var(--yellow); color: var(--navy); }
.game-btn-sport { background: var(--teal); color: #fff; }
.icon { font-size: 2rem; line-height: 1; }
.badge-footer {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(10,20,40,0.82);
  backdrop-filter: blur(10px);
  padding: 8px 20px 8px 8px;
  border-radius: 50px;
  white-space: nowrap;
  z-index: 999;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}
.badge-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  border: 2px solid rgba(255,255,255,0.5);
  flex-shrink: 0;
}
.badge-text { display: flex; flex-direction: column; gap: 1px; }
.badge-label { font-size: 0.62rem; font-weight: 700; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.8px; }
.badge-name { font-size: 0.88rem; font-weight: 900; color: #fff; }
</style>
