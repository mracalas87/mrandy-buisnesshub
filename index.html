<title>Mr Andy's Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F3EE;
  --navy: #1A2E4A;
  --yellow: #F5C800;
  --teal: #0D9488;
  --text: #1A2E4A;
  --display: 'Fredoka One','Nunito',sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A2B; --text: #EEE8DF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg: #0D1A2B; --text: #EEE8DF; color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px 100px;
  gap: 28px;
}
h1 {
  font-size: 2.4rem;
  font-weight: 400;
  font-family: var(--display);
  text-align: center;
  line-height: 1.1;
}
h1 span { color: var(--yellow); }
.games {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 320px;
}
.game-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  border-radius: 18px;
  text-decoration: none;
  font-family: var(--display);
  font-weight: 400;
  font-size: 1.25rem;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.game-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
.game-btn-lemon { background: var(--yellow); color: var(--navy); }
.game-btn-sport { background: var(--teal); color: #fff; }
.icon { font-size: 2rem; line-height: 1; }
.badge-footer{display:flex;align-items:center;gap:8px;background:var(--yellow);color:var(--navy);padding:3px 3px 3px 14px;border-radius:999px;font-family:var(--display);font-size:0.95rem;font-weight:800;line-height:1;white-space:nowrap;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;box-shadow:0 3px 14px rgba(0,0,0,0.22);border:2px solid var(--navy);}
.badge-footer img{width:32px;height:32px;border-radius:50%;border:2px solid var(--navy);display:block;flex:none;object-fit:cover;object-position:center center}
@media(max-width:480px){.badge-footer{font-size:0.75rem;gap:6px}.badge-footer img{width:26px;height:26px}}
</style>
